name: Build and push images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PLATFORMS: linux/arm64
  API_IMAGE: photogal-api

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # API — Fastify + React build intégré (un seul service, un seul port)
  # ---------------------------------------------------------------------------
  build-api:
    name: Build & push API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: vars
        run: echo "sha=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Login to registry
        run: |
          echo "Registry host: ${{ secrets.REGISTRY_URL }}"
          echo "${{ secrets.REGISTRY_USERPASSWORD }}" | podman login \
            --username "${{ secrets.REGISTRY_USERNAME }}" \
            --password-stdin \
            "${{ secrets.REGISTRY_URL }}"

      - name: Build API image
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.API_IMAGE }}
          tags: latest
          platforms: ${{ env.PLATFORMS }}
          context: .
          containerfiles: |
            ./apps/api/Dockerfile
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Push API to registry
        id: push-image
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_USERPASSWORD }}

      - name: Print pushed image
        run: echo "Pushed → ${{ steps.push-image.outputs.registry-paths }}"

      - name: Job summary
        run: |
          {
            echo "## API"
            echo ""
            echo "| Tag | Image |"
            echo "| --- | --- |"
            echo "| \`latest\` | \`${{ env.API_IMAGE }}:latest\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Redéploiement Portainer
  # ---------------------------------------------------------------------------
  redeploy-portainer:
    name: Trigger Portainer redeploy
    runs-on: ubuntu-latest
    needs: [build-api]
    if: success()
    steps:
      - name: Call Portainer stack webhook
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "PORTAINER_WEBHOOK_URL n'est pas configuré — skip redeploy."
            exit 0
          fi
          echo "Triggering Portainer redeploy..."
          curl -fsSL -X POST "$WEBHOOK" \
            -H 'Content-Length: 0' \
            --max-time 30
          echo "Portainer notifié — la stack va pull la nouvelle image."

      - name: Final summary
        if: always()
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          {
            echo "## Déploiement terminé"
            echo ""
            echo "**Commit :** [\`$SHORT_SHA\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"
            echo ""
            echo "| Service | Tag |"
            echo "| --- | --- |"
            echo "| API (+ Web) | \`${{ env.API_IMAGE }}:latest\` |"
            echo ""
            echo "- [Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- Portainer : webhook déclenché"
          } >> "$GITHUB_STEP_SUMMARY"
