services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"  # MinIO console (admin UI)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-photogal}
      DB_PATH: /app/data/photogal.db
      STORAGE_LIMIT_GB: ${STORAGE_LIMIT_GB:-10}
      IMAGE_CONCURRENCY: ${IMAGE_CONCURRENCY:-1}
      # Tas JS sous la limite du conteneur : sharp/libvips alloue en dehors du tas
      NODE_OPTIONS: --max-old-space-size=${API_HEAP_MB:-384}
    # Au-delà, le conteneur est tué puis relancé (restart) au lieu de faire swapper le Pi
    mem_limit: ${API_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    volumes:
      - db_data:/app/data
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  # Sauvegarde nocturne chiffrée vers Google Drive (voir deploy/backup/README.md)
  backup:
    build:
      context: deploy/backup
    environment:
      S3_BUCKET: ${S3_BUCKET:-photogal}
      DB_PATH: /data/db/photogal.db
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 3 * * *}
      RCLONE_CONFIG_MINIO_TYPE: s3
      RCLONE_CONFIG_MINIO_PROVIDER: Minio
      RCLONE_CONFIG_MINIO_ENDPOINT: http://minio:9000
      RCLONE_CONFIG_MINIO_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
      RCLONE_CONFIG_MINIO_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin}
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
      RCLONE_CONFIG_GDRIVE_TOKEN: ${BACKUP_GDRIVE_TOKEN}
      RCLONE_CONFIG_BACKUP_TYPE: crypt
      RCLONE_CONFIG_BACKUP_REMOTE: gdrive:lisaphoto-backup
      RCLONE_CONFIG_BACKUP_PASSWORD: ${BACKUP_CRYPT_PASSWORD}
      RCLONE_CONFIG_BACKUP_PASSWORD2: ${BACKUP_CRYPT_SALT}
    volumes:
      - db_data:/data/db
      - backup_state:/state
    mem_limit: 256m
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  minio_data:
  db_data:
  backup_state:
